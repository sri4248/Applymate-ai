services:
  - type: web
    name: applymate-ai-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # you will paste this in Render dashboard
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a secure random value
      - key: DATABASE_URL
        value: /data/applymate.db
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: ALLOWED_ORIGINS
        value: "*"           # update with your Vercel URL after deploy
    disk:
      name: applymate-data
      mountPath: /data
      sizeGB: 1
